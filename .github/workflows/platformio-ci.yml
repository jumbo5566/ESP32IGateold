name: PlatformIO CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # 仅拉取最新代码，加速构建

    - name: Set up Python (兼容版本 3.13)
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'  # 严格匹配 esp32 平台要求的 3.10-3.13 范围

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install platformio==6.1.18  # 指定稳定版本，避免兼容问题

    - name: 编译 ESP32 项目（esp32-sh1106 环境）
      run: pio run -e esp32-sh1106  # 匹配项目 platformio.ini 中的环境配置

    # 可选：如果需要编译多个环境（如 esp32c3-sh1106），取消下面注释
    # - name: 编译 ESP32C3 项目（esp32c3-sh1106 环境）
    #   run: pio run -e esp32c3-sh1106

    - name: 保存编译产物
      uses: actions/upload-artifact@v4
      with:
        name: firmware-esp32-sh1106
        path: .pio/build/esp32-sh1106/firmware.bin  # 固件输出路径（根据环境名自动生成）
        retention-days: 7  # 产物保留 7 天，可按需调整
        if-no-files-found: error  # 若未找到固件，标记构建失败
